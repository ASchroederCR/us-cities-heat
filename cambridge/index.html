<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boston / Cambridge Metro, MA — Heat Risk Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── header ─────────────────────────────────────────────── */
    #header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    #logo { height: 52px; width: auto; flex-shrink: 0; }
    #header h1 { font-size: 1rem; font-weight: 700; color: #0f172a; letter-spacing: .01em; }
    #header .subtitle { font-size: .75rem; color: #64748b; }
    .stat-pill {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: .72rem;
      color: #475569;
      white-space: nowrap;
    }
    .stat-pill strong { color: #0f172a; }
    #download-btn {
      margin-left: auto;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
    }
    #download-btn:hover { background: #1e293b; }

    /* ── time slider bar ────────────────────────────────────── */
    #time-bar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #time-bar .icon-btn {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: .8rem;
      color: #334155;
      flex-shrink: 0;
    }
    #time-bar .icon-btn:hover { background: #e2e8f0; }
    #time-slider { flex: 1; accent-color: #dc2626; cursor: pointer; }
    #time-date {
      font-size: .8rem; font-weight: 600; color: #0f172a;
      min-width: 92px; text-align: center;
    }
    #time-note { font-size: .68rem; color: #94a3b8; white-space: nowrap; }

    /* ── body layout ────────────────────────────────────────── */
    #body { display: flex; flex: 1; overflow: hidden; }

    #sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-section { padding: 12px 14px; border-bottom: 1px solid #eef1f5; }
    .sidebar-section h4 {
      font-size: .68rem; color: #94a3b8; text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 8px; font-weight: 700;
    }

    .toggle-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; text-align: left;
      background: none; border: 1px solid transparent; border-radius: 6px;
      padding: 6px 8px; margin-bottom: 2px;
      font-size: .78rem; color: #334155; cursor: pointer;
    }
    .toggle-btn:hover { background: #f8fafc; }
    .toggle-btn.active { background: #eef2ff; border-color: #c7d2fe; color: #3730a3; font-weight: 600; }
    .toggle-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: #cbd5e1; }
    .toggle-btn.active .toggle-dot { background: #6366f1; }

    #variable-desc { font-size: .68rem; color: #64748b; line-height: 1.4; padding: 8px 14px 0; }

    #legend-gradient { height: 12px; border-radius: 3px; margin-bottom: 4px; }
    #legend-labels { display: flex; justify-content: space-between; font-size: .68rem; color: #64748b; }
    #legend-bins { display: flex; flex-direction: column; gap: 3px; }
    .legend-bin-row { display: flex; align-items: center; gap: 8px; font-size: .7rem; color: #334155; }
    .legend-swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.08); }
    #legend-note { font-size: .65rem; color: #94a3b8; margin-top: 6px; line-height: 1.35; }

    /* ── map ────────────────────────────────────────────────── */
    #map-wrap { flex: 1; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; background: #e2e8f0; }

    .popup-name { font-size: .85rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .popup-sub { font-size: .68rem; color: #64748b; margin-bottom: 8px; }
    .popup-row { display: flex; justify-content: space-between; gap: 14px; font-size: .74rem; color: #334155; padding: 1px 0; }
    .popup-row span:first-child { color: #64748b; }
    .popup-row span:last-child { font-weight: 600; }
    .popup-chart-wrap { position: relative; height: 110px; width: 230px; margin-top: 8px; }
    .leaflet-popup-content { margin: 12px 14px; }
  </style>
</head>

  { key:"heat_anomaly_f",     label:"Heat Anomaly",     unit:"°F", decimals:1, daily:true,  classify:"natural",
    desc:"How far this day's peak heat index runs above the tract's 10-year historical average for this calendar day." },
  { key:"is_extreme",         label:"Extreme Heat Day", unit:"",   daily:true,  classify:"binary",
    desc:"Whether this day's peak heat index exceeded the tract's historical 95th percentile for this calendar day." },
  { key:"nighttime_stress_f", label:"Nighttime Stress", unit:"°F", decimals:1, daily:true,  classify:"natural",
    desc:"How far this night's heat index runs above the historical median — limited overnight cooling." },

  { key:"lst_anomaly_c",       label:"Land Surface Temp Anomaly", unit:"°C", decimals:2, classify:"natural",
    desc:"Satellite land surface temperature vs. warm-season baseline — surface heating (pavement, roofs), not air temperature. Single seasonal value, doesn't change with the date slider." },
  { key:"built_frac",          label:"Built Fraction",   unit:"%",  decimals:0, scale100:true, classify:"natural",
    desc:"Share of land covered by impervious/built surface (ESA WorldCover). Static." },
  { key:"tree_frac",           label:"Tree Canopy",      unit:"%",  decimals:1, scale100:true, classify:"natural", direction:"bad-low",
    desc:"Share of land under tree cover (ESA WorldCover). Static." },
  { key:"viirs_mean",          label:"Night Lights (VIIRS)", unit:"", decimals:1, palette:"blue-yellow",
    desc:"Mean night-time light radiance. Deep blue = low, light yellow = high. Static." },
  { key:"frac_under5",         label:"Population Under 5",  unit:"%", decimals:1, palette:"viridis",
    desc:"Share of residents under age 5 (WorldPop). Viridis, classed into quintiles. Static." },
  { key:"frac_elderly_65plus", label:"Population Over 65", unit:"%", decimals:1, palette:"viridis",
    desc:"Share of residents 65 and older (WorldPop). Viridis, classed into quintiles. Static." },
];
const VAR_BY_KEY = Object.fromEntries(VARIABLES.map(v => [v.key, v]));
const NO_DATA_COLOR = "#cbd5e1";
const EXTREME_COLOR = "#dc2626";
const NOT_EXTREME_COLOR = "#e2e8f0";
const VIRIDIS_STOPS = ["#440154","#482878","#3e4989","#31688e","#26828e","#1f9e89","#35b779","#6ece58","#b5de2b","#fde725"];
const CLASS_BINS = 5;

let GEO, DAILY, META, DATES;
let map, geojsonLayer, popupChart = null, openPopupLayer = null;
let currentVar = "daytime_peak_f";
let dayIndex = 0;
let playTimer = null;

// per-variable precomputed classification breaks (computed once at boot)
const BREAKS = {};

async function boot() {
  const [staticGeo, daily, meta] = await Promise.all([
    fetchJson("data/static.geojson"),
    fetchJson("data/daily.json"),
    fetchJson("data/last_run.json"),
  ]);
  GEO = staticGeo; DAILY = daily; META = meta;
  DATES = META.data_date_range ? datesInRange() : [];
  dayIndex = DATES.length - 1; // default to most recent day

  populateHeader();
  buildToggles();
  computeAllBreaks();
  initMap();
  updateVariableDesc();
  renderLayer();
  renderLegend();
  wireTimeControls();

  requestAnimationFrame(() => requestAnimationFrame(() => {
    map.invalidateSize();
    // Deliberately NOT calling fitBounds() to the full 591-tract extent —
    // that would zoom out past the Boston/Cambridge core every time. The
    // map opens at META.map_center/map_zoom (set in build_data.py) instead;
    // the wider metro area is still fully reachable by panning/zooming out.
  }));
  window.addEventListener("resize", () => map.invalidateSize());
}

function datesInRange() {
  const first = Object.values(DAILY)[0];
  return first.map(d => d.date);
}

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

function populateHeader() {
  document.getElementById("header-subtitle").textContent =
    `Suffolk & Middlesex counties · Census tracts · ${META.data_date_range[0]} to ${META.data_date_range[1]} · Last updated ${META.last_updated}`;
  document.getElementById("stat-tracts").innerHTML = `<strong>${META.tract_count}</strong> tracts`;
  document.getElementById("stat-pop").innerHTML = `Population: <strong>${Math.round(META.total_population).toLocaleString()}</strong>`;
  document.getElementById("stat-extreme").innerHTML = `<strong>${META.extreme_tract_days}</strong> extreme tract-days`;
}

// ── toggles ────────────────────────────────────────────────────────────────
function buildToggles() {
  const dailyHtml = VARIABLES.filter(v => v.daily).map(v => toggleBtnHtml(v)).join("");
  const staticHtml = VARIABLES.filter(v => !v.daily).map(v => toggleBtnHtml(v)).join("");
  document.getElementById("daily-toggles").innerHTML = dailyHtml;
  document.getElementById("static-toggles").innerHTML = staticHtml;
}

function toggleBtnHtml(v) {
  return `<button class="toggle-btn${v.key===currentVar?" active":""}" id="toggle-${v.key}" onclick="selectVariable('${v.key}')">
    <span class="toggle-dot"></span>${v.label}
  </button>`;
}

function selectVariable(key) {
  currentVar = key;
  document.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`toggle-${key}`).classList.add("active");
  updateVariableDesc();
  renderLayer();
  renderLegend();
  refreshOpenPopup();
}

function updateVariableDesc() {
  document.getElementById("variable-desc").textContent = VAR_BY_KEY[currentVar].desc;
}

// ── value lookup (daily vs static) ──────────────────────────────────────────
function valueFor(props, varDef) {
  if (varDef.daily) {
    const series = DAILY[props.name];
    if (!series) return null;
    const day = series[dayIndex];
    return day ? day[varDef.key] : null;
  }
  return props[varDef.key];
}

// ── classification ────────────────────────────────────────────────────────
function computeAllBreaks() {
  for (const v of VARIABLES) {
    if (v.classify !== "natural" || v.palette) continue;
    const values = v.daily
      ? Object.values(DAILY).flatMap(series => series.map(d => d[v.key])).filter(x => x != null)
      : GEO.features.map(f => f.properties[v.key]).filter(x => x != null);
    BREAKS[v.key] = computeNaturalBreaks(values, CLASS_BINS);
  }
  for (const v of VARIABLES) {
    if (v.palette !== "viridis") continue;
    const values = GEO.features.map(f => f.properties[v.key]).filter(x => x != null);
    BREAKS[v.key] = computeQuantileBreaks(values, CLASS_BINS);
  }
}

function computeQuantileBreaks(values, nBins) {
  const sorted = [...values].sort((a, b) => a - b);
  const breaks = [];
  for (let i = 1; i < nBins; i++) breaks.push(sorted[Math.min(sorted.length - 1, Math.floor((i / nBins) * sorted.length))]);
  return breaks;
}

function computeNaturalBreaks(values, nBins, maxIter = 25) {
  const sorted = [...values].sort((a, b) => a - b);
  const unique = [...new Set(sorted)];
  if (unique.length <= nBins) {
    const breaks = [];
    for (let i = 0; i < unique.length - 1; i++) breaks.push((unique[i] + unique[i + 1]) / 2);
    while (breaks.length < nBins - 1) breaks.push(breaks[breaks.length - 1] ?? unique[0]);
    return breaks;
  }
  let centroids = [];
  for (let i = 0; i < nBins; i++) centroids.push(sorted[Math.min(sorted.length - 1, Math.floor((i + 0.5) / nBins * sorted.length))]);
  for (let iter = 0; iter < maxIter; iter++) {
    const sums = new Array(nBins).fill(0), counts = new Array(nBins).fill(0);
    for (const v of sorted) {
      let bestI = 0, bestD = Infinity;
      for (let i = 0; i < nBins; i++) { const d = Math.abs(v - centroids[i]); if (d < bestD) { bestD = d; bestI = i; } }
      sums[bestI] += v; counts[bestI]++;
    }
    let changed = false;
    for (let i = 0; i < nBins; i++) {
      if (!counts[i]) continue;
      const mean = sums[i] / counts[i];
      if (Math.abs(mean - centroids[i]) > 1e-9) changed = true;
      centroids[i] = mean;
    }
    if (!changed) break;
  }
  centroids.sort((a, b) => a - b);
  const breaks = [];
  for (let i = 0; i < centroids.length - 1; i++) breaks.push((centroids[i] + centroids[i + 1]) / 2);
  return breaks;
}

function binIndex(value, breaks) {
  for (let i = 0; i < breaks.length; i++) if (value <= breaks[i]) return i;
  return breaks.length;
}

function binColor(bin, varDef) {
  let t = bin / (CLASS_BINS - 1);
  if (varDef.palette === "viridis") return viridisColor(t);
  if (varDef.direction === "bad-low") t = 1 - t;
  return heatColor(t);
}

function heatColor(t) {
  t = Math.max(0, Math.min(1, t));
  if (t >= 0.75) return interpolateColor("#eab308", "#dc2626", (t - 0.75) / 0.25);
  if (t >= 0.50) return interpolateColor("#22c55e", "#eab308", (t - 0.50) / 0.25);
  return interpolateColor("#166534", "#22c55e", t / 0.50);
}

function viridisColor(t) {
  t = Math.max(0, Math.min(1, t));
  const n = VIRIDIS_STOPS.length - 1;
  const idx = t * n, i0 = Math.floor(idx), i1 = Math.min(i0 + 1, n);
  return interpolateColor(VIRIDIS_STOPS[i0], VIRIDIS_STOPS[i1], idx - i0);
}

function interpolateColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  const r = Math.round(r1 + (r2-r1)*t).toString(16).padStart(2,"0");
  const g = Math.round(g1 + (g2-g1)*t).toString(16).padStart(2,"0");
  const b = Math.round(b1 + (b2-b1)*t).toString(16).padStart(2,"0");
  return `#${r}${g}${b}`;
}

function colorForFeature(props, varDef) {
  if (!props.has_data) return NO_DATA_COLOR;
  const value = valueFor(props, varDef);
  if (value == null) return NO_DATA_COLOR;

  if (varDef.classify === "binary") return value ? EXTREME_COLOR : NOT_EXTREME_COLOR;
  if (varDef.palette === "blue-yellow") {
    const stats = statsFor(varDef);
    if (!stats || stats.min == null) return NO_DATA_COLOR;
    const t = stats.max > stats.min ? (value - stats.min) / (stats.max - stats.min) : 0.5;
    return interpolateColor("#0a1a3f", "#fef9c3", Math.max(0, Math.min(1, t)));
  }
  const breaks = BREAKS[varDef.key];
  if (!breaks) return NO_DATA_COLOR;
  return binColor(binIndex(value, breaks), varDef);
}

function statsFor(varDef) {
  return varDef.daily ? META.daily_stats[varDef.key] : META.static_stats[varDef.key];
}

function fmtValue(value, varDef) {
  if (value == null) return "–";
  if (varDef.classify === "binary") return value ? "Yes" : "No";
  const scaled = varDef.scale100 ? value * 100 : value;
  return scaled.toFixed(varDef.decimals ?? 1) + (varDef.unit || "");
}

// ── map ────────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map("map", { zoomControl: false }).setView(META.map_center, META.map_zoom);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; OpenStreetMap contributors',
    subdomains: "abcd", maxZoom: 19,
  }).addTo(map);
  L.control.zoom({ position: "topright" }).addTo(map);

  // Built once and never torn down — recreating the layer on every slider
  // tick/variable switch used to close any open popup (its Leaflet layer
  // object was destroyed), which is why popups intermittently showed no
  // chart. renderLayer() now just restyles the existing layers in place.
  geojsonLayer = L.geoJSON(GEO, {
    style() { return {}; }, // real styling applied by renderLayer() right after
    onEachFeature(feature, layer) {
      layer.bindPopup(() => popupHtml(feature.properties), { maxWidth: 260 });
      layer.on({
        mouseover() { layer.setStyle({ fillOpacity: HOVER_FILL_OPACITY, weight: 2, color: "#0f172a" }); },
        mouseout()  { applyStyleTo(layer); },
        popupopen()  { openPopupLayer = feature.properties.name; renderPopupChartFor(layer); },
        popupclose() { if (openPopupLayer === feature.properties.name) openPopupLayer = null; },
      });
    },
  }).addTo(map);

  renderLayer();
}

const BASE_FILL_OPACITY  = 0.42; // more transparent — basemap streets/labels stay visible through the layer
const HOVER_FILL_OPACITY = 0.68;

function applyStyleTo(layer) {
  const varDef = VAR_BY_KEY[currentVar];
  layer.setStyle({
    fillColor: colorForFeature(layer.feature.properties, varDef),
    fillOpacity: BASE_FILL_OPACITY,
    color: "#64748b",
    weight: 0.6,
    opacity: 1,
  });
}

function renderLayer() {
  if (!geojsonLayer) return;
  geojsonLayer.eachLayer(applyStyleTo);
}

// Keeps an already-open popup's text (date/value) and chart in sync when the
// day or variable changes — bindPopup's content function only runs when a
// popup first opens, so without this the popup would show stale text.
function refreshOpenPopup() {
  if (!openPopupLayer) return;
  let target = null;
  geojsonLayer.eachLayer(l => { if (l.feature.properties.name === openPopupLayer) target = l; });
  if (!target) return;
  target.setPopupContent(popupHtml(target.feature.properties));
  renderPopupChartFor(target);
}

// ── popup ──────────────────────────────────────────────────────────────────
function popupHtml(props) {
  if (!props.has_data) return `<div class="popup-name">${props.name}</div><div class="popup-sub">No data</div>`;
  const varDef = VAR_BY_KEY[currentVar];
  const val = valueFor(props, varDef);
  const u5  = props.frac_under5 != null ? props.frac_under5.toFixed(1) + "%" : "–";
  const o65 = props.frac_elderly_65plus != null ? props.frac_elderly_65plus.toFixed(1) + "%" : "–";
  const tree = props.tree_frac != null ? (props.tree_frac * 100).toFixed(1) + "%" : "–";
  return `
    <div class="popup-name">${props.name}</div>
    <div class="popup-sub">${DATES[dayIndex] || ""}</div>
    <div class="popup-row"><span>${varDef.label}</span><span>${fmtValue(val, varDef)}</span></div>
    <div class="popup-row"><span>Population</span><span>${props.population ? Math.round(props.population).toLocaleString() : "–"}</span></div>
    <div class="popup-row"><span>Under 5</span><span>${u5}</span></div>
    <div class="popup-row"><span>65+</span><span>${o65}</span></div>
    <div class="popup-row"><span>Tree canopy</span><span>${tree}</span></div>
    <div class="popup-chart-wrap"><canvas class="popup-chart"></canvas></div>
  `;
}

// Scoped to this layer's own popup DOM (via popup.getElement()) rather than
// a global id lookup. When switching directly from one open popup to
// another, Leaflet briefly has both popups' DOM in the document at once —
// a global document.getElementById("popup-chart") would nondeterministically
// grab whichever popup's canvas happens to come first, drawing the new
// chart into the OLD (closing) popup while the newly-opened one stayed
// blank. This was the "time series disappearing" bug.
function renderPopupChartFor(layer) {
  const name = layer.feature.properties.name;
  const series = DAILY[name];
  if (!series) return;
  const popup = layer.getPopup();
  const el = popup && popup.getElement();
  const canvas = el && el.querySelector("canvas.popup-chart");
  if (!canvas) return;

  const labels = series.map(d => d.date.slice(5));
  const hiMax  = series.map(d => d.daytime_peak_f);
  const p95    = series.map(d => d.ref_daytime_hi_p95);

  if (popupChart) popupChart.destroy();
  popupChart = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: {
      labels,
      datasets: [
        { label: "Daytime HI", data: hiMax, borderColor: "#dc2626", backgroundColor: "rgba(220,38,38,.08)", fill: true, tension: .3, pointRadius: (ctx)=>ctx.dataIndex===dayIndex?4:0, borderWidth: 2 },
        { label: "Hist. p95", data: p95, borderColor: "#3b82f6", borderDash: [4,3], fill: false, tension: .3, pointRadius: 0, borderWidth: 1.3 },
      ],
    },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: "#94a3b8", font: { size: 8 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 5 }, grid: { display: false } },
        y: { ticks: { color: "#94a3b8", font: { size: 8 }, callback: v => v+"°F" }, grid: { color: "#f1f5f9" } },
      },
      plugins: {
        legend: { labels: { color: "#475569", font: { size: 8 }, boxWidth: 10 } },
      },
    },
  });
}

// ── legend ─────────────────────────────────────────────────────────────────
function renderLegend() {
  const varDef = VAR_BY_KEY[currentVar];
  document.getElementById("legend-note").textContent = "";

  if (varDef.classify === "binary") {
    show("legend-bins", "flex"); hide("legend-gradient"); hide("legend-labels");
    document.getElementById("legend-bins").innerHTML = `
      <div class="legend-bin-row"><div class="legend-swatch" style="background:${EXTREME_COLOR}"></div><span>Extreme heat day</span></div>
      <div class="legend-bin-row"><div class="legend-swatch" style="background:${NOT_EXTREME_COLOR}"></div><span>Not extreme</span></div>
    `;
    return;
  }

  if (varDef.palette === "blue-yellow") {
    show("legend-gradient", "block"); show("legend-labels", "flex"); hide("legend-bins");
    const stats = statsFor(varDef);
    document.getElementById("legend-gradient").style.background = "linear-gradient(to right, #0a1a3f, #fef9c3)";
    document.getElementById("legend-min").textContent = fmtValue(stats.min, varDef);
    document.getElementById("legend-max").textContent = fmtValue(stats.max, varDef);
    return;
  }

  // classed bins (natural breaks or quantile)
  show("legend-bins", "flex"); hide("legend-gradient"); hide("legend-labels");
  const stats = statsFor(varDef);
  const breaks = BREAKS[varDef.key];
  if (!breaks || !stats || stats.min == null) {
    document.getElementById("legend-bins").innerHTML = `<div class="legend-bin-row"><div class="legend-swatch" style="background:${NO_DATA_COLOR}"></div><span>No data</span></div>`;
    return;
  }
  const edges = [stats.min, ...breaks, stats.max];
  const rows = [];
  for (let i = 0; i < CLASS_BINS; i++) {
    rows.push(`<div class="legend-bin-row"><div class="legend-swatch" style="background:${binColor(i, varDef)}"></div><span>${fmtValue(edges[i], varDef)} – ${fmtValue(edges[i+1], varDef)}</span></div>`);
  }
  document.getElementById("legend-bins").innerHTML = rows.join("");
  document.getElementById("legend-note").textContent = varDef.palette === "viridis"
    ? "Quintiles — equal number of tracts per color."
    : varDef.daily
      ? "Natural breaks, computed once across all days for a stable scale while scrubbing the slider."
      : "Natural breaks classification.";
}

function show(id, display) { document.getElementById(id).style.display = display; }
function hide(id) { document.getElementById(id).style.display = "none"; }

// ── time controls ─────────────────────────────────────────────────────────
function wireTimeControls() {
  const slider = document.getElementById("time-slider");
  slider.max = DATES.length - 1;
  slider.value = dayIndex;
  updateTimeLabel();
  slider.addEventListener("input", e => {
    dayIndex = parseInt(e.target.value, 10);
    updateTimeLabel();
    renderLayer();
    refreshOpenPopup();
  });
}

function updateTimeLabel() {
  document.getElementById("time-date").textContent = DATES[dayIndex] || "–";
  const varDef = VAR_BY_KEY[currentVar];
  document.getElementById("time-note").textContent = varDef.daily
    ? ""
    : `"${varDef.label}" is a static value — slider only affects daily layers.`;
}

function stepDay(delta) {
  dayIndex = Math.max(0, Math.min(DATES.length - 1, dayIndex + delta));
  document.getElementById("time-slider").value = dayIndex;
  updateTimeLabel();
  renderLayer();
  refreshOpenPopup();
}

function togglePlay() {
  const btn = document.getElementById("play-btn");
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
    btn.innerHTML = "&#9654;";
    return;
  }
  btn.innerHTML = "&#10074;&#10074;";
  playTimer = setInterval(() => {
    if (dayIndex >= DATES.length - 1) { dayIndex = 0; } else { dayIndex++; }
    document.getElementById("time-slider").value = dayIndex;
    updateTimeLabel();
    renderLayer();
    refreshOpenPopup();
  }, 900);
}

// ── CSV download ─────────────────────────────────────────────────────────
function downloadCSV() {
  const staticCols = ["population","built_frac","tree_frac","viirs_mean","gdl_hdi","frac_under5","frac_elderly_65plus","lst_anomaly_c"];
  const dailyCols = ["daytime_peak_f","heat_anomaly_f","is_extreme","nighttime_stress_f","ref_daytime_hi_p95","ref_daytime_hi_mean"];
  const headers = ["tract","date", ...dailyCols, ...staticCols];

  const rows = [];
  for (const feature of GEO.features) {
    const props = feature.properties;
    if (!props.has_data) continue;
    const series = DAILY[props.name] || [];
    for (const day of series) {
      const row = [props.name, day.date];
      for (const c of dailyCols) row.push(day[c] ?? "");
      for (const c of staticCols) row.push(props[c] ?? "");
      rows.push(row);
    }
  }

  const csv = [headers.join(",")]
    .concat(rows.map(r => r.map(v => typeof v === "string" && v.includes(",") ? `"${v}"` : v).join(",")))
    .join("\n");

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `cambridge_heat_data_${META.last_updated}.csv`;
  a.click();
}

boot();
</script>
</body>
</html>
